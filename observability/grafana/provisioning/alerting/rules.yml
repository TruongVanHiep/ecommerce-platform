apiVersion: 1

groups:
  - orgId: 1
    name: application-alerts
    folder: E-commerce Mini
    interval: 1m
    rules:
      - uid: high-5xx-error-rate
        title: High 5xx error rate
        condition: C
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "5xx error rate is above 5% for the last 5 minutes"
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              expr: >-
                100 * sum(rate(http_server_requests_seconds_count{application="E-commerce-Mini", outcome="SERVER_ERROR"}[5m]))
                /
                sum(rate(http_server_requests_seconds_count{application="E-commerce-Mini"}[5m]))
              instant: true
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [5]

      - uid: high-p95-latency
        title: High p95 HTTP latency
        condition: C
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency is above 1.5s for the last 5 minutes"
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              expr: >-
                histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{application="E-commerce-Mini"}[5m])) by (le))
              instant: true
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1.5]

      - uid: backend-down
        title: Backend is down
        condition: C
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus cannot scrape the backend target"
        noDataState: Alerting
        execErrState: Error
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 120, to: 0 }
            model:
              refId: A
              expr: 'up{job="backend"}'
              instant: true
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
