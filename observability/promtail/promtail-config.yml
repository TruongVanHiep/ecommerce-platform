server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      - source_labels: [container]
        regex: "ecommerce-(.*)"
        target_label: service

    # Tách mức log ra thành nhãn riêng.
    #
    # Thiếu phần này thì Loki không biết mức log là gì, Grafana phải tự đoán từ
    # nội dung dòng và đoán sai — mọi dòng đều hiện DEBUG kể cả khi backend chỉ
    # sinh INFO và WARN. Hậu quả: lọc theo mức log không hoạt động, và người
    # dùng Grafana để tìm lỗi sẽ bỏ sót cả WARN lẫn ERROR.
    #
    # Chỉ tách `level`, KHÔNG tách traceId: traceId gần như không trùng nhau nên
    # đưa lên nhãn sẽ tạo ra hàng triệu stream và làm Loki sập. Nó vẫn nằm trong
    # nội dung dòng, và Grafana đã có derivedFields bắt nó để nhảy sang Tempo
    # (xem observability/grafana/provisioning/datasources/datasources.yml).
    pipeline_stages:
      # Container không phải backend (mysql, grafana, promtail...) không ghi log
      # JSON. json stage gặp dòng không phải JSON sẽ bỏ qua, không làm hỏng gì.
      - json:
          expressions:
            level: level
      - labels:
          level:
