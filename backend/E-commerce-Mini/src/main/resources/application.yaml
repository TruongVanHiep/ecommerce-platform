server:
  port: 8080
  # Giới hạn kích thước request để chặn payload quá lớn gây cạn RAM/CPU.
  max-http-request-header-size: 16KB
  tomcat:
    max-http-form-post-size: 256KB
    max-swallow-size: 256KB

spring:
  # Secrets được nạp từ biến môi trường (file .env ở gốc repo).
  # Xem SECURITY.md để biết cách nạp .env khi chạy bằng IntelliJ.
  application:
    name: E-commerce-Mini
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile


  datasource:
    # Mặc định là MySQL chạy trên máy (dev). Khi deploy lên nền tảng có DB
    # quản lý sẵn (Northflank, RDS...) thì ghi đè trọn chuỗi bằng DB_URL.
    url: ${DB_URL:jdbc:mysql://localhost:3306/e_commerce_mini?useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
jwt:
  signerKey: ${JWT_SIGNER_KEY}
  # Access token hạn ngắn vì không thu hồi được; client tự gia hạn bằng refresh token.
  access-token-minutes: 15
  refresh-token-days: 7

app:
  mail:
    # smtp  — gửi qua Gmail bằng app password. Đủ cho môi trường phát triển,
    #         nhưng thư gần như luôn rơi vào thư rác của người nhận vì địa chỉ
    #         @gmail.com không có SPF/DKIM cho tên miền nào cả.
    # resend — gửi qua API HTTPS từ tên miền riêng. Dùng ở production.
    provider: ${MAIL_PROVIDER:smtp}
    resend-api-key: ${RESEND_API_KEY:}
    # Bỏ trống khi dùng smtp => lấy chính spring.mail.username.
    # Với resend thì BẮT BUỘC, và phải thuộc tên miền đã xác minh ở Resend.
    from-address: ${MAIL_FROM_ADDRESS:}
    from-name: ${MAIL_FROM_NAME:MiniCommerce}
  cors:
    # Nhiều origin cách nhau bằng dấu phẩy. Mặc định cho môi trường dev local.
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173}
  oauth2:
    # Domain thật khi deploy, đổi qua biến môi trường APP_PUBLIC_URL.
    redirect-uri: ${APP_PUBLIC_URL:http://localhost:5173}/oauth2/redirect
  admin:
    # Bỏ trống => KHÔNG seed tài khoản admin (tránh tài khoản mặc định admin/admin).
    init-password: ${ADMIN_INIT_PASSWORD:}
  rate-limit:
    # Tất cả đều đọc được từ biến môi trường: khi deploy thấy mức nào quá chặt
    # hoặc quá lỏng thì chỉnh trên nền tảng rồi restart, không phải sửa code và
    # chờ build lại.
    #
    # Giới hạn nghiêm ngặt cho đăng nhập và áp voucher — mỗi lần thử sai đều
    # giúp kẻ tấn công tiến gần hơn tới mục tiêu.
    strict-capacity: ${RATE_LIMIT_STRICT_CAPACITY:5}
    strict-window-minutes: ${RATE_LIMIT_STRICT_WINDOW_MINUTES:15}
    # Đăng ký tài khoản — rộng hơn vì đăng ký hỏng không tiết lộ gì, mà người
    # dùng thật rất hay phải thử lại (trùng tên, trùng email, sai định dạng).
    register-capacity: ${RATE_LIMIT_REGISTER_CAPACITY:20}
    register-window-minutes: ${RATE_LIMIT_REGISTER_WINDOW_MINUTES:15}
    # Giới hạn cho các request ghi dữ liệu (POST/PUT/DELETE) còn lại
    write-capacity: ${RATE_LIMIT_WRITE_CAPACITY:60}
    # Giới hạn chung cho mọi request khác
    global-capacity: ${RATE_LIMIT_GLOBAL_CAPACITY:200}

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      # Lấy mẫu 100% vì đây là môi trường dev/demo, lượng request nhỏ.
      # Khi deploy lên nền tảng KHÔNG có Tempo thì đặt TRACING_SAMPLE_RATE=0,
      # nếu không backend sẽ liên tục cố gửi trace tới địa chỉ không tồn tại
      # và ghi đầy log lỗi export.
      probability: ${TRACING_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

