server:
  port: 8080
  # Giới hạn kích thước request để chặn payload quá lớn gây cạn RAM/CPU.
  max-http-request-header-size: 16KB
  tomcat:
    max-http-form-post-size: 256KB
    max-swallow-size: 256KB

spring:
  # Secrets được nạp từ biến môi trường (file .env ở gốc repo).
  # Xem SECURITY.md để biết cách nạp .env khi chạy bằng IntelliJ.
  application:
    name: E-commerce-Mini
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile


  datasource:
    url: jdbc:mysql://localhost:3306/e_commerce_mini?useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
jwt:
  signerKey: ${JWT_SIGNER_KEY}
  # Access token hạn ngắn vì không thu hồi được; client tự gia hạn bằng refresh token.
  access-token-minutes: 15
  refresh-token-days: 7

app:
  oauth2:
    redirect-uri: http://localhost:5173/oauth2/redirect
  admin:
    # Bỏ trống => KHÔNG seed tài khoản admin (tránh tài khoản mặc định admin/admin).
    init-password: ${ADMIN_INIT_PASSWORD:}
  rate-limit:
    # Giới hạn nghiêm ngặt cho các route xác thực (login, đăng ký, áp voucher)
    strict-capacity: 5
    strict-window-minutes: 15
    # Giới hạn cho các request ghi dữ liệu (POST/PUT/DELETE) còn lại
    write-capacity: 60
    # Giới hạn chung cho mọi request khác
    global-capacity: 200

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

